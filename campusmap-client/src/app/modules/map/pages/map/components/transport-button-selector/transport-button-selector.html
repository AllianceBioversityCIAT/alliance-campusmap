<div class="absolute bottom-0 flex-auto bg-white w-full z-2 p-4">
  <p-toast />
  <div class="flex flex-auto justify-center">
    <form
      #exampleForm="ngForm"
      (ngSubmit)="onSubmit(exampleForm)"
      class="flex justify-center flex-col gap-4">
      <div class="flex flex-col gap-4">
        <p-selectbutton
          class="flex flex-auto h-10 justify-center items-center shadow-[4px_4px_5px_rgba(0,0,0,0.3)]"
          #model="ngModel"
          [(ngModel)]="value"
          [options]="stateOptions"
          optionLabel="label"
          optionValue="value"
          [invalid]="model.invalid && (model.touched || exampleForm.submitted)"
          required
          name="value" />
        <p class="overflow-hidden text-clip font-medium">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum id faucibus libero.
        </p>
        @if (model.invalid && (model.touched || exampleForm.submitted)) {
          <p-message severity="error" size="small" variant="simple"
            >Selection is required.</p-message
          >
        }
      </div>
      <button
        pButton
        type="submit"
        class="flex self-center justify-self-center w-45 h-10 shadow-[4px_4px_5px_rgba(0,0,0,0.3)] rounded-lg">
        <img src="assets/icons/arrow_start.svg" alt="" />
        <span pButtonLabel>Iniciar</span>
      </button>
    </form>
  </div>
</div>
