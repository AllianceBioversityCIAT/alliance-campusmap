<section class="items-center">
  <p-selectbutton
    [options]="stateOptions"
    [ngModel]="value()"
    (ngModelChange)="onLanguageChange($event)"
    optionLabel="label"
    optionValue="value"
    [attr.aria-label]="'HOME.LANGUAGE.TOGGLE' | translate"
    [allowEmpty]="false"
    [ngClass]="selectedLanguageClass()" />
</section>
