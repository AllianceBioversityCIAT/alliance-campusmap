<!-- Contenedor flotante (colócalo sobre el mapa) -->
<div class="absolute top-40 right-4 md:right-8 z-20 flex flex-col items-end select-none">
  <!-- Botón principal (icono) -->
  <button
    type="button"
    (click)="toggle()"
    aria-label="Mostrar filtros"
    title="Mostrar filtros"
    class="w-12 h-12 bg-white rounded-full shadow-[0_0_0_2px_rgba(0,0,0,0.1)] hover:bg-gray-100">
    <img src="assets/icons/filters.svg" alt="Filtros" class="w-full h-full" />
  </button>

  <!-- Barra de iconos (desplegable) -->
  <div
    *ngIf="open"
    class="flex flex-col md:flex-row rounded-4xl gap-4 md:gap-8 shadow-md px-7 md:px-8 py-2 md:py-4 border-gray-200 w-full h-full bg-white items-center">
    <button
      *ngFor="let f of filters"
      type="button"
      class="w-full h-full hover:bg-gray-100 text-gray-800"
      [attr.aria-label]="f.label"
      [attr.title]="f.label">
      <div class="flex flex-col items-center justify-center w-full h-full">
        <img [src]="f.src" alt="{{ f.label }}" class="w-12 h-12" />
        <span aria-hidden="true" class="text-base font-bold mt-2">{{ f.name }}</span>
      </div>
    </button>
  </div>
</div>
