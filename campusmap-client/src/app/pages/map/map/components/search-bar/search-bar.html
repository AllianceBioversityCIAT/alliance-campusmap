<!-- Floating main container -->
<div
  class="absolute top-8 left-1/2 -translate-x-1/2 z-3 w-[90%] max-w-lg md:max-w-2xl lg:max-w-xl bg-white shadow-lg border border-gray-200 rounded-lg">
  <!-- Search field -->
  <div class="flex px-3 md:px-6 py-2 md:py-3">
    <i class="pi pi-search search-icon text-gray-500 mr-4"></i>

    <label for="search-input" class="sr-only">{{ 'Map.searchPlaceholder' | translate }}</label>
    <!-- Controlled input. Open the dropdown when focusing -->
    <input
      id="search-input"
      type="text"
      [ngModel]="searchQuery()"
      (ngModelChange)="onInputChange($event)"
      [placeholder]="'Map.searchPlaceholder' | translate"
      [attr.aria-label]="'Map.searchPlaceholder' | translate"
      (focus)="onFocus()"
      (blur)="onBlur()"
      class="w-full outline-none text-gray-700 placeholder-gray-400 text-base md:text-lg lg:text-xl leading-normal" />
  </div>

  <!-- Search results dropdown -->
  <div
    *ngIf="isOpen() && displayedItems.length > 0"
    class="max-h-60 overflow-auto border-t border-gray-200 divide-y divide-gray-100 bg-white">
    <!-- Display history or filtered results -->
    <button
      *ngFor="let place of displayedItems"
      (click)="selectPlace(place)"
      type="button"
      class="w-full px-4 py-2 hover:bg-gray-100 cursor-pointer flex items-center justify-between text-base md:text-lg lg:text-xl leading-normal">
      <span>{{ place.properties.name }}</span>
      <!-- Show icon for history items -->
      <i *ngIf="searchQuery().length < 2" class="pi pi-history text-gray-400 text-sm"></i>
    </button>
  </div>

  <!-- Message when searching but no results -->
  <div
    *ngIf="isOpen() && searchQuery().length >= 3 && filteredPlaces().length === 0"
    class="px-4 py-3 text-gray-500 text-center border-t border-gray-200 text-base md:text-lg lg:text-xl leading-normal">
    {{ 'Map.noResults' | translate }}
  </div>
</div>
