<!-- Floating main container -->
<div
  class="absolute top-8 md:top-8 px-3 left-1/2 -translate-x-1/2 z-2 w-[90%] md:w-3xl lg:w-[25%] lg:h-[7.5%] bg-white shadow-lg border border-gray-200">
  <!-- Search field -->
  <div class="flex px-3 md:px-6 py-2 md:py-3">
    <i class="pi pi-search search-icon text-gray-500 mr-4"></i>

    <!-- Controlled input. Open the dropdown when focusing -->
    <input
      type="text"
      [placeholder]="'Map.searchPlaceholder' | translate"
      (focus)="isOpen = true"
      (blur)="isOpen = false"
      class="w-full outline-none text-gray-700 placeholder-gray-400 text-(length:--font-size-xl) leading-(length:--line-height-xl) md:text-(length:--font-size-4xl) md:leading-(length:--line-height-4xl) lg:text-(length:--font-size-2xl) lg:leading-(length:--line-height-2xl)" />
  </div>

  <!-- Search results dropdown -->
  <ul
    *ngIf="isOpen"
    class="max-h-60 overflow-auto border-t border-gray-200 divide-y divide-gray-100 bg-white">
    <!-- Elements repeated as a test -->
    <li
      *ngFor="let item of [1, 2, 3, 4]"
      class="px-4 py-2 hover:bg-gray-100 cursor-pointer flex items-center justify-between text-(length:--font-size-2xl) leading-(length:--line-height-2xl) md:text-(length:--font-size-4xl) md:leading-(length:--line-height-4xl) lg:text-(length:--font-size-2xl) lg:leading-(length:--line-height-2xl)">
      <span>{{ 'Map.label' | translate }}</span>
    </li>
  </ul>
</div>
