<!-- Search bar container with white background -->
<div class="absolute top-8 left-1/2 -translate-x-1/2 z-3 w-[90%] max-w-lg md:max-w-2xl lg:max-w-xl">
  <!-- Search field -->
  <div class="flex px-3 md:px-6 py-2 md:py-3 justify-between items-center bg-white rounded-full">
    <i class="pi pi-search search-icon text-gray-500 mr-4"></i>

    <label for="search-input" class="sr-only">{{ 'Map.searchPlaceholder' | translate }}</label>
    <!-- Controlled input. Open the dropdown when focusing -->
    <input
      id="search-input"
      type="text"
      [ngModel]="searchQuery()"
      (ngModelChange)="onInputChange($event)"
      [placeholder]="'Map.searchPlaceholder' | translate"
      [attr.aria-label]="'Map.searchPlaceholder' | translate"
      (focus)="onFocus()"
      (blur)="onBlur()"
      class="w-full outline-none text-gray-700 placeholder-gray-500 text-base font-medium md:text-lg lg:text-xl" />
  </div>

  <!-- Search results dropdown -->
  <div
    *ngIf="isOpen() && displayedItems.length > 0"
    class="max-h-60 overflow-auto border-gray-200 divide-y divide-gray-100 bg-white">
    <!-- Display history or filtered results -->
    <button
      *ngFor="let place of displayedItems"
      (click)="selectPlace(place)"
      type="button"
      class="w-full px-4 py-2 hover:border-1 hover:border-black cursor-pointer flex items-center justify-between text-base md:text-lg lg:text-xl leading-normal">
      <div class="flex items-center gap-3">
        <!-- Show icon for history items -->
        <img
          *ngIf="searchQuery().length < 2"
          [src]="getPlaceIcon(place)"
          [alt]="place.properties.name"
          title="type icon"
          class="w-4 h-4" />
        <span>{{ place.properties.name }}</span>
      </div>
      <i *ngIf="searchQuery().length < 2" class="pi pi-history text-gray-400 text-sm"></i>
    </button>
  </div>

  <!-- Message when searching but no results -->
  <div
    *ngIf="isOpen() && searchQuery().length >= 3 && filteredPlaces().length === 0"
    class="px-4 py-3 text-gray-500 bg-white rounded-full text-center text-base md:text-lg lg:text-xl">
    {{ 'Map.noResults' | translate }}
  </div>

  <!-- Filter buttons section -->
  <div class="px-4 py-3 border-gray-200 flex gap-2 flex-wrap justify-center">
    <button
      (click)="selectFilter('building')"
      type="button"
      [style.background-color]="isFilterActive('building') ? filterActiveColor() : '#f1f2f5'"
      [ngClass]="{
        'text-white': isFilterActive('building'),
        'text-gray-700': !isFilterActive('building')
      }"
      class="flex px-4 py-2 rounded-full text-sm font-medium transition-colors"
      [style.--hover-color]="filterHoverColor()">
      {{ 'Map.filters.buildings' | translate }}
    </button>
    <button
      (click)="selectFilter('cafeteria')"
      type="button"
      [style.background-color]="isFilterActive('cafeteria') ? filterActiveColor() : '#f1f2f5'"
      [ngClass]="{
        'text-white': isFilterActive('cafeteria'),
        'text-gray-700': !isFilterActive('cafeteria')
      }"
      class="flex px-4 py-2 rounded-full text-sm font-medium transition-colors"
      [style.--hover-color]="filterHoverColor()">
      {{ 'Map.filters.cafeterias' | translate }}
    </button>
    <button
      (click)="selectFilter('parking')"
      type="button"
      [style.background-color]="isFilterActive('parking') ? filterActiveColor() : '#f1f2f5'"
      [ngClass]="{
        'text-white': isFilterActive('parking'),
        'text-gray-700': !isFilterActive('parking')
      }"
      class="flex px-4 py-2 rounded-full text-sm font-medium transition-colors"
      [style.--hover-color]="filterHoverColor()">
      {{ 'Map.filters.parking' | translate }}
    </button>
  </div>
</div>
