<div class="absolute bottom-0 w-screen p-4 flex-auto bg-white rounded-t-lg z-2">
  <div class="flex">
    <div class="flex items-center justify-center">
      <p-button [outlined]="true" styleClass="flex items-center justify-center">
        <ng-template pTemplate="content">
          <img src="assets/icons/popUpTImer/arrowBack.svg" alt="icon" />
        </ng-template>
      </p-button>
    </div>
    <div class="flex flex-auto flex-col justify-center items-center">
      <div class="flex gap-2">
        <img src="assets/icons/popUpTImer/timerSmall.svg" alt="" class="object-contain" />
        <p class="font-bold text-2xl">2 minutos</p>
      </div>
      <div class="flex gap-4 mt-2 text-xl">
        <p>1 km</p>
        <p>{{ currentTime }}</p>
      </div>
    </div>
    <div class="flex items-center justify-center">
      <p-button [outlined]="true" styleClass="flex items-center justify-center">
        <ng-template pTemplate="content">
          <img src="assets/icons/popUpTImer/close.svg" alt="icon" />
        </ng-template>
      </p-button>
    </div>
  </div>
</div>
