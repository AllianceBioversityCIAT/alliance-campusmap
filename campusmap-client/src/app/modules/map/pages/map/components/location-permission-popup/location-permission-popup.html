<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6">
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center">
        <svg
          class="w-8 h-8 text-blue-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h2 class="text-xl font-bold text-center text-gray-800 mb-2">
      {{ 'LocationPermission.title' | translate }}
    </h2>

    <!-- Description -->
    <p class="text-gray-600 text-lg text-center mb-6">
      {{ 'LocationPermission.description' | translate }}
    </p>

    <!-- Buttons -->
    <div class="flex gap-3">
      <button
        type="button"
        (click)="onDecline()"
        class="flex-1 px-4 py-2 border-2 border-[#173f6f] text-[#173f6f] rounded-lg text-xl font-[500] shadow-[4px_4px_5px_rgba(0,0,0,0.3)]">
        {{ 'LocationPermission.decline' | translate }}
      </button>
      <button
        type="button"
        (click)="onAccept()"
        class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg text-xl font-[500] shadow-[4px_4px_5px_rgba(0,0,0,0.3)]">
        {{ 'LocationPermission.accept' | translate }}
      </button>
    </div>
  </div>
</div>
