<!-- Contenedor flotante (colócalo sobre el mapa) -->
<div class="absolute top-40 right-4 md:right-8 z-20 flex flex-col items-end select-none">
  <!-- Botón principal (icono) -->
  <button
    type="button"
    (click)="toggle()"
    aria-label="Mostrar filtros"
    title="Mostrar filtros"
    class="w-12 h-12 md:w-16 md:h-16 bg-white rounded-full shadow-[0_0_0_2px_rgba(0,0,0,0.1)] hover:bg-gray-100">
    <img src="assets/icons/filters.svg" alt="Filtros" class="w-full h-full" />
  </button>

  <!-- Barra de iconos (desplegable) -->
  <div class="w-screen h-full flex justify-end items-center mr-16">
    <div *ngIf="open" class="grid grid-cols-2 w-65 h-full gap-4">
      <button
        *ngFor="let f of filters"
        type="button"
        class="w-full h-full bg-white border border-[#cccccc] rounded-lg shadow-[4px_4px_5px_rgba(0,0,0,0.3)]"
        [attr.aria-label]="f.label"
        [attr.title]="f.label">
        <div class="flex flex-col items-center justify-center w-full h-full">
          <img [src]="f.src" alt="{{ f.label }}" class="w-1/2 h-1/2" />
          <span aria-hidden="true" class="mt-2">{{ f.name }}</span>
        </div>
      </button>
    </div>
  </div>
</div>
