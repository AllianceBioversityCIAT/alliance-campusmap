<!-- Main container fixed at the bottom -->
<div
  class="absolute bottom-0 left-0 w-screen lg:w-1/4 h-75 lg:h-100 md:h-110 px-4 md:px-8 lg:pt-8 pt-4 bg-white rounded-t-lg z-3">
  <!-- Parking title -->
  <p
    class="font-semibold text-(length:--font-size-2xl) md:text-(length:--font-size-4xl) lg:text-(length:--font-size-2xl)">
    {{ 'InformationPopUpParking.parking' | translate }}
  </p>
  <!-- Main image of the place -->
  <div class="flex flex-none w-full h-30 md:h-55 justify-center my-4 md:pb-4">
    <img
      src="assets/images/sostenibilidad.webp"
      [attr.alt]="'InformationPopUpParking.Alt' | translate"
      class="rounded-lg object-none w-full" />
  </div>

  <!-- Button to open the path to the point -->
  <div class="flex flex-auto justify-center items-center">
    <a
      routerLink="/"
      pButton
      class="flex justify-center items-center w-80px md:w-60 lg:w-40 h-10 md:h-15 lg:h-10 shadow-[4px_4px_5px_rgba(0,0,0,0.3)] text-center rounded-lg">
      <span
        pButtonLabel
        class="text-(length:--font-size-2xl) leading-(length:--line-height-2xl) md:text-(length:--font-size-4xl) lg:text-(length:--font-size-2xl) md:leading-(length:--line-height-4xl) lg:leading-(length:--line-height-2xl) font-medium text-white text-center">
        {{ 'InformationPopUpParking.howToGet' | translate }}
      </span>
    </a>
  </div>
</div>
