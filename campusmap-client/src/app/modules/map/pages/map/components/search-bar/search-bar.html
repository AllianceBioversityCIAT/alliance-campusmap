<!-- Contenedor principal flotante -->
<div
  class="absolute top-12 md:top-8 lg:w-[95%] px-3 left-1/2 -translate-x-1/2 z-30 w-sm md:w-3xl bg-white shadow-lg border border-gray-200">
  <!-- Campo de búsqueda -->
  <div class="flex items-center px-3 md:px-6 py-2 md:py-3">
    <i class="pi pi-search search-icon text-gray-500 mr-4"></i>
    <input
      type="text"
      placeholder="Search"
      (focus)="isOpen = true"
      (blur)="isOpen = false"
      class="w-full outline-none text-gray-700 placeholder-gray-400 text-2xl md:text-4xl" />
    <i class="pi pi-microphone text-gray-500 ml-2 cursor-pointer"></i>
  </div>

  <!-- Lista desplegable de resultados -->
  <ul
    *ngIf="isOpen"
    class="max-h-60 overflow-auto border-t border-gray-200 divide-y divide-gray-100">
    <li
      *ngFor="let item of [1, 2, 3, 4]"
      class="px-4 py-2 hover:bg-gray-100 cursor-pointer flex items-center justify-between text-2xl md:text-4xl">
      <span>Label</span>
    </li>
  </ul>
</div>
