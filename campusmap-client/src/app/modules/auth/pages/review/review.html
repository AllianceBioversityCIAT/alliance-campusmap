<div
  class="flex flex-col h-dvh justify-center items-center bg-[url(/assets/images/map.webp)] bg-center bg-no-repeat bg-cover">
  <div class="flex flex-col gap-20 text-center mb-10">
    <p class="font-bold text-3xl leading-9">
      {{ 'Review.title' | translate }}
    </p>
    <p class="text-2xl leading-8">
      {{ 'Review.subtitle' | translate }}
    </p>
  </div>
  <div class="flex flex-col justify-center items-center">
    <div class="flex justify-center items-center">
      <form #form="ngForm" (ngSubmit)="onSubmit(form)" class="flex flex-col flex-auto gap-4">
        <div class="flex flex-col items-center mb-20">
          <p-rating
            #ratingValue="ngModel"
            [ngModel]="value()"
            (ngModelChange)="value.set($event)"
            required
            name="ratingValue"
            class="flex justify-center">
          </p-rating>
          <p-message
            *ngIf="form.submitted && value() === null"
            severity="error"
            size="large"
            variant="simple">
            {{ 'Review.ratingRequired' | translate }}
          </p-message>
        </div>
        <div class="flex w-screen justify-center items-center gap-8">
          <button
            pButton
            variant="outlined"
            severity="secondary"
            type="button"
            class="w-30 h-13 shadow-[4px_4px_5px_rgba(0,0,0,0.3)]">
            <span pButtonLabel class="text-2xl leading-8">{{ 'Review.cancel' | translate }}</span>
          </button>
          <button
            pButton
            severity="primary"
            type="submit"
            class="w-30 h-13 shadow-[4px_4px_5px_rgba(0,0,0,0.3)]">
            <span pButtonLabel class="text-2xl leading-8">{{ 'Review.submit' | translate }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
